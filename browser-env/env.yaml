version: '1'
name: browser-env
owner: ''
slug: /browser-env
env_type: local
description: >-
  A2E browser environment host. Exposes a real headless Chromium as the env/*
  episodic capability (reset/step/observe/close, scored episodes, transition
  log) and as the tools/* capability (browser_navigate / browser_click / ...).
tags: browser,web,cua,computer-use
categories: ''
image_config:
  image_id: browser-env:latest
  credentials:
    name: ''
    username: ''
    password: ''
    server: ''
resource_config:
  cpu: '2'
  # Chromium needs more headroom than a plain Python host: 2g RAM + 1g /dev/shm
  # (the container runs Chromium with --disable-dev-shm-usage as a fallback).
  mem_limit: 2g
  shm_size: 1gb
  restart: unless-stopped
  num_replicas: 1
  gpu_enabled_flag: false
  node_type: default
  ports:
  - '8770'
  port_mapper:
    '8770': '8770'
base_path: /app
env_vars:
  A2E_PORT: '8770'
pool_config:
  min_size: 1
  max_size: 2
  idle_ttl_s: 300
meta_data:
  stars: 0
  task_count: 4
  has_github: false
  github_url: null
  commit_id: null