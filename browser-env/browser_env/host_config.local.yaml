# GENERATED by scripts/make_local_config.py — do not edit by hand.
# Host-side config: absolute local paths, backend=scripted.
host_id: "browser-env-local"

transport:
  type: http
  config:
    base_url: "http://localhost:8791"
    send_path: "/send"
    stream_path: "/stream"

server:
  host: "0.0.0.0"
  port: 8791

auth_token: null

audit:
  enabled: true
  path: "/tmp/a2e/browser/audit.log"
  rotate:
    max_bytes: 10485760
    backup_count: 5
  session_id_source: host_id

snapshot_store:
  type: file
  config:
    root: "/tmp/a2e/browser"

plugins:
  - name: browser_env
    type: env
    cls: browser_env.plugin.BrowserEnvPlugin
    metadata:
      enabled: true
      priority: 0
      exclusive: false
      BACKEND: "scripted"
      HEADLESS: true
      BROWSER: "chromium"
      ROOT: "/tmp/a2e/browser"
      DEFAULT_MAX_STEPS: 15
      MAX_TEXT_CHARS: 4000
      MAX_ELEMENTS: 120
      BROWSER_TIMEOUT_MS: 15000
      STEP_PENALTY: 0.0
      PROGRESS_REWARD: 0.0

  - name: browser_tools
    type: tools
    cls: browser_env.browser_tool.BrowserToolPlugin
    metadata:
      enabled: true
      priority: 5
      exclusive: false
      ENV_PLUGIN: "browser_env"
      DEFAULT_URL: ""
      MAX_TEXT_CHARS: 4000
